# === Main Settings ===
# Based on your .tmux.conf and .tmux.conf.local

# Set prefix to Ctrl-Space
set -gu prefix2
unbind C-a
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# General settings
set -g default-terminal "screen-256color"
setw -g xterm-keys on
set -s escape-time 10
set -sg repeat-time 600
set -s focus-events on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
setw -g automatic-rename on
set -g renumber-windows on
set -g set-titles on
set -g display-panes-time 800
set -g display-time 1000
set -g status-interval 10
set -g monitor-activity on
set -g visual-activity off

# Enable mouse mode
set -g mouse on

# Clear screen and history
bind -n C-l send-keys C-l \; run 'sleep 0.2' \; clear-history

# === Byobu-style Function Key bindings (no prefix needed) ===
bind-key -n F2 new-window
bind-key -n F3 previous-window
bind-key -n F4 next-window
bind-key -n S-F2 split-window -v # Shift-F2 for vertical split
bind-key -n C-F2 split-window -h # Ctrl-F2 for horizontal split
bind-key -n F5 command-prompt -I "source-file ~/.tmux.conf" "source-file %1" # Reload config
bind-key -n F6 detach-client
bind-key -n F7 copy-mode
bind-key -n F8 rename-window

# === Your Preserved Vim-style Pane Switching ===
# Smart pane switching with awareness of Vim splits.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind-key -n 'C-j' if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind-key -n 'C-k' if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind-key -n 'C-l' if-shell "$is_vim" "send-keys C-l"  "select-pane -R"
bind-key -n 'C-\' if-shell "$is_vim" "send-keys C-\\" "select-pane -l"
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# === Standard Tmux Bindings (with your C-Space prefix) ===
# Session handling
bind e new-window -n "~/.tmux.conf" "sh -c '${EDITOR:-vim} ~/.tmux.conf && tmux source ~/.tmux.conf && tmux display \"~/.tmux.conf sourced\"'"
bind r source-file ~/.tmux.conf \; display '~/.tmux.conf sourced'
bind C-c new-session
bind C-f command-prompt -p find-session 'switch-client -t %%'
bind BTab switch-client -l

# Window/Pane management
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind > swap-pane -D
bind < swap-pane -U
bind + resize-pane -Z # Maximize pane
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2
bind Tab last-window

# Copy/Paste
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line
bind b list-buffers
bind p paste-buffer -p
bind P choose-buffer

# === Theme and Status Bar ===
# From your .tmux.conf.local

# Colors
tmux_conf_theme_colour_1="#282828"
tmux_conf_theme_colour_2="#1b1b1b"
tmux_conf_theme_colour_3="#8a8a8a"
tmux_conf_theme_colour_4="#7daea3"
tmux_conf_theme_colour_5="#d8a657"
tmux_conf_theme_colour_6="#282828"
tmux_conf_theme_colour_7="#282828"
tmux_conf_theme_colour_8="#282828"
tmux_conf_theme_colour_9="#d8a657"
tmux_conf_theme_colour_10="#a9b665"
tmux_conf_theme_colour_11="#a9b482"
tmux_conf_theme_colour_12="#8a8a8a"
tmux_conf_theme_colour_13="#282828"
tmux_conf_theme_colour_14="#282828"
tmux_conf_theme_colour_15="#282828"
tmux_conf_theme_colour_16="#e78a4e"
tmux_conf_theme_colour_17="#ddc7a1"

# General appearance
set -g window-style "fg=default,bg=default"
set -g window-active-style "fg=default,bg=$tmux_conf_theme_colour_2"
set -g pane-border-style "fg=$tmux_conf_theme_colour_2,bg=default"
set -g pane-active-border-style "fg=$tmux_conf_theme_colour_4,bg=default"
set -g display-panes-colour "$tmux_conf_theme_colour_4"
set -g display-panes-active-colour "$tmux_conf_theme_colour_4"

# Status line
set -g status-style "fg=$tmux_conf_theme_colour_3,bg=$tmux_conf_theme_colour_1,none"
set -g message-style "fg=$tmux_conf_theme_colour_1,bg=$tmux_conf_theme_colour_5,bold"
set -g message-command-style "fg=$tmux_conf_theme_colour_5,bg=$tmux_conf_theme_colour_1,bold"
setw -g mode-style "fg=$tmux_conf_theme_colour_1,bg=$tmux_conf_theme_colour_5,bold"

# Window status
setw -g window-status-style "fg=$tmux_conf_theme_colour_3,bg=$tmux_conf_theme_colour_1,none"
setw -g window-status-format "#I #W#{?window_bell_flag,🔔,}#{?window_zoomed_flag,🔍,}"
setw -g window-status-current-style "fg=$tmux_conf_theme_colour_1,bg=$tmux_conf_theme_colour_4,bold"
setw -g window-status-current-format "#I #W"
setw -g window-status-activity-style "fg=default,bg=default,underscore"
setw -g window-status-bell-style "fg=$tmux_conf_theme_colour_5,bg=default,blink,bold"
setw -g window-status-last-style "fg=$tmux_conf_theme_colour_4,bg=$tmux_conf_theme_colour_2,none"

# Status line content
set -g status-left-length 100
set -g status-right-length 100
set -g status-left " ❐ #S | ↑#{?uptime_y, #{uptime_y}y,}#{?uptime_d, #{uptime_d}d,}#{?uptime_h, #{uptime_h}h,}#{?uptime_m, #{uptime_m}m,} "
set -g status-right " #{prefix} , %R , %d %b | #{username} | #{hostname} "
