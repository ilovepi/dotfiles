# === Main Settings ===
# Tmux Configuration

# Set prefix to Ctrl-Space
set -gu prefix2
unbind C-a
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# General settings
set -g default-terminal "screen-256color"
setw -g xterm-keys on
set -s escape-time 10
set -sg repeat-time 600
set -s focus-events on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
setw -g automatic-rename on
set -g renumber-windows on
set -g set-titles on
set -g display-panes-time 800
set -g display-time 1000
set -g status-interval 10
set -g monitor-activity on
set -g visual-activity off

# Enable mouse mode
set -g mouse on

# Clear screen and history
bind -n C-l send-keys C-l \; run 'sleep 0.2' \; clear-history

# === Byobu-style Function Key bindings (no prefix needed) ===
bind-key -n F2 new-window
bind-key -n F3 previous-window
bind-key -n F4 next-window
bind-key -n S-F2 split-window -v # Shift-F2 for vertical split
bind-key -n C-F2 split-window -h # Ctrl-F2 for horizontal split
bind-key -n F5 source-file ~/.tmux.conf \; display "Config reloaded"
bind-key -n F6 detach-client
bind-key -n F7 copy-mode
bind-key -n F8 command-prompt -p "(rename-window) " "rename-window '%%'"

# === Vim-style Pane Switching ===
# Smart pane switching with awareness of Vim splits.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\S+\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind-key -n 'C-j' if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind-key -n 'C-k' if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind-key -n 'C-l' if-shell "$is_vim" "send-keys C-l"  "select-pane -R"
bind-key -n 'C-\' if-shell "$is_vim" "send-keys C-\\" "select-pane -l"
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# === Standard Tmux Bindings ===
# Set vi mode for copy mode and command prompt
setw -g mode-keys vi

# Session handling
bind e new-window -n "~/.tmux.conf" "sh -c 'nvim ~/dotfiles/tmux/.tmux.conf && tmux source ~/.tmux.conf && tmux display "~/.tmux.conf reloaded"'"
bind r source-file ~/.tmux.conf \; display '~/.tmux.conf reloaded'
bind C-c new-session
bind C-f command-prompt -p find-session 'switch-client -t %%'
bind BTab switch-client -l

# Window/Pane management
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -h -c "#{pane_current_path}"

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind > swap-pane -D
bind < swap-pane -U
bind + resize-pane -Z # Maximize pane
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2
bind Tab last-window

# Copy/Paste (vi-style)
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -i -selection clipboard'
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line
bind-key -T copy-mode-vi / command-prompt -i -p "(search down)" "send -X search-forward-incremental \"%%%\""
bind-key -T copy-mode-vi ? command-prompt -i -p "(search up)" "send -X search-backward-incremental \"%%%\""

bind b list-buffers
bind p paste-buffer -p
bind P choose-buffer

# === Gruvbox Material Pills Theme ===

# Set status bar position to top
set -g status-position top

# Colors
bg0="#282828"
bg1="#3c3836"
fg0="#d4be98"
gray="#928374"
red="#ea6962"
green="#a9b665"
yellow="#e78a4e"
bg_yellow="#d8a657"
blue="#7daea3"
purple="#d3869b"
aqua="#89b482"

# Separators
separator_left=""
separator_right=""

# General status bar style
set -g status-style "fg=$fg0,bg=$bg1"

# Left side of the status bar
set -g status-left-length 40
set -g status-left "#[fg=#{?client_prefix,$bg_yellow,$blue},bg=$bg1]#{?client_prefix,#[bold],}${separator_left}#[fg=$bg0,bg=#{?client_prefix,$bg_yellow,$blue}]  #S #[fg=#{?client_prefix,$bg_yellow,$blue},bg=$bg1]${separator_right}"

# Right side of the status bar
set -g status-right-length 150
set -g status-right "#[fg=$gray,bg=$bg1]${separator_left}#[fg=$fg0,bg=$gray]  #h #[fg=$gray,bg=$bg1]${separator_right} #[fg=$aqua,bg=$bg1]${separator_left}#[fg=$bg0,bg=$aqua]  %Y-%m-%d #[fg=$aqua,bg=$bg1]${separator_right} #[fg=$purple,bg=$bg1]${separator_left}#[fg=$bg0,bg=$purple]  %H:%M #[fg=$purple,bg=$bg1]${separator_right}"

# Window list alignment
set -g status-justify centre

# Inactive window style
setw -g window-status-style "fg=$gray,bg=$bg1"
setw -g window-status-format " #I | #W "
setw -g window-status-separator ""

# Active window style
setw -g window-status-current-style "fg=$aqua,bg=$bg1,bold"
setw -g window-status-current-format "#[fg=$aqua,bg=$bg1]${separator_left}#[fg=$bg0,bg=$aqua] #I | #W #[fg=$aqua,bg=$bg1]${separator_right}"

# Pane borders
set -g pane-border-style "fg=$gray"
set -g pane-active-border-style "fg=$aqua"

# Active pane highlight
setw -g window-style "bg=$bg1"
setw -g window-active-style "bg=$bg0"

# Message/command prompt style
set -g message-style "fg=$fg0,bg=$bg1,bold"
setw -g mode-style "fg=$fg0,bg=$bg1,bold"
