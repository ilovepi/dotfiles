# hypridle - idle management daemon
# https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
# Started via `exec-once = hypridle` in hyprland.conf

general {
    # Use hyprlock as the lock screen; guard against launching duplicates.
    lock_cmd = pidof hyprlock || hyprlock
    # Lock before the system suspends so it's locked on wake.
    before_sleep_cmd = loginctl lock-session
    # Restore displays after resuming from suspend.
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 10 min: lock the session
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 11 min: turn the monitors off (the main goal: don't burn all night)
listener {
    timeout = 660
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# 30 min: suspend the machine
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
