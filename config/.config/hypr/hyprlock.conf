# hyprlock - screen locker
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

general {
    hide_cursor = true
    grace = 0
    ignore_empty_input = true
}

background {
    monitor =
    color = rgba(1a1a1aff)
    # To use an image instead, set a path and tune the blur:
    # path = ~/Pictures/wallpaper.png
    blur_passes = 2
    blur_size = 6
}

input-field {
    monitor =
    size = 300, 50
    position = 0, -20
    halign = center
    valign = center

    outline_thickness = 2
    rounding = 10
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    outer_color = rgba(33ccffee)
    inner_color = rgba(1a1a1aee)
    font_color = rgba(ffffffee)
    check_color = rgba(00ff99ee)
    fail_color = rgba(ff3333ee)

    placeholder_text = <i>Password...</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    fade_on_empty = false
}

# Clock
label {
    monitor =
    text = $TIME
    color = rgba(ffffffee)
    font_size = 64
    font_family = monospace
    position = 0, 120
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(ffffffcc)
    font_size = 20
    font_family = monospace
    position = 0, 50
    halign = center
    valign = center
}
